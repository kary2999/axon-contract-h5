<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0B0E11">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Axon 合约 Demo</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app"></div>
  <noscript>请开启 JavaScript</noscript>
  <script>
    // 双击打开（file://）时浏览器会拦截 ES 模块，给出明确提示而不是黑屏
    if (location.protocol === 'file:') {
      document.getElementById('app').innerHTML =
        '<div style="padding:32px 20px;color:#EAECEF;font:15px/1.7 -apple-system,sans-serif">' +
        '<h3 style="margin:0 0 12px">请用 http 方式打开</h3>' +
        '<p>浏览器不允许 <code>file://</code> 加载 ES 模块。在 axon-client 目录执行：</p>' +
        '<pre style="background:#1E2329;padding:12px;border-radius:8px">python3 serve.py 8080</pre>' +
        '<p>然后访问 <b>http://localhost:8080/</b></p></div>';
    }
  </script>
  <script src="vendor/vue.global.prod.js"></script>
  <script src="vendor/klinecharts.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
